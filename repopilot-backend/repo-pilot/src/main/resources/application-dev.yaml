spring:
  application:
    name: repo-pilot
  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/db
    username: postgres
    password: 140503
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: RepoPilotHikariPool
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  # Flyway Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  # Oauth2 Configuration
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:Ov23liYD3wCIZ0UJHohT}
            client-secret: ${GITHUB_CLIENT_SECRET:811b6e32b3f809b048d20ffda4099165716f684a}
            scope:
              - read:user
              - repo
        provider:
          github:
            user-name-attribute: id
  # AI Configuration
  ai:
    chat:
      client:
        enabled: true
      memory:
        repository:
          jdbc:
            initialize-schema: always
    openai:
      api-key: ${CHAT_KEY:demo}
      base-url: ${CHAT_BASE_URL:https://api.openai.com}
      read-timeout: 300s
      connect-timeout: 60s
      chat:
        options:
          model: ${CHAT_MODEL:gpt-4o-mini}
          temperature: 0.2
          max-completion-tokens: 2048
      embedding:
        api-key: ${EMBEDDING_KEY:${CHAT_KEY:demo}}
        base-url: ${EMBEDDING_BASE_URL:${CHAT_BASE_URL:https://api.openai.com}}
        model: ${EMBEDDING_MODEL:text-embedding-3-small}
        dimensions: 2048
    # Vector DB Configuration
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        api-key: ${QDRANT_API_KEY}
        collection-name: ${QDRANT_COLLECTION_NAME:Repo-Pilot}
        content-field-name: ${QDRANT_CONTENT_FIELD_NAME:repo_content}
        use-tls: ${QDRANT_USE_TLS:false}
        initialize-schema: true
# RAG Configuration
rag:
  chunking:
    chunk-size: 400
    min-chunk-size-chars: 100
    min-chunk-length-to-embed: 10
    max-num-chunks: 5000
    keep-separator: true
  retrieval:
    top-k: 5
    candidate-k: 20
    similarity-threshold: 0.70
  rewrite:
    api-key: ${REWRITE_KEY}
    base-url: ${REWRITE_BASE_URL}
    chat:
      model: ${REWRITE_MODEL}
      temperature: 0.1
      max-tokens: 512
# JWT Token Configuration
security:
  accessToken:
    expiration: 900
  refreshToken:
    expiration: 86400
  token:
    issuer: repo-pilot
  cookie:
    name:
      refreshTokenName: refreshToken
      accessTokenName: accessToken
    cookieHttpOnly: ${COOKIE_HTTP_ONLY:true}
    cookieSecure: ${COOKIE_SECURE:false}
    cookieSameSite: ${COOKIE_SAME_SITE:lax}
    cookieDomain: ${COOKIE_DOMAIN:localhost}
  # Keys Configuration
  keys:
    privateKeyPath: classpath:key/private_key.pem
    publicKeyPath: classpath:key/public_key.pem
  crypto:
    token-encryptor-password: ${TOKEN_PASSWORD:}
    token-encryptor-salt: ${TOKEN_SALT:}
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN:}
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      - HEAD
    allowed-headers:
      - Content-Type
      - X-Api-Version
      - X-Conversation-ID
    allow-credentials: true
# Oauth2 Success Anf Failure URL
oauth2:
  success: http://localhost:5173/auth/oauth2/success
  failure: http://localhost:5173/auth/oauth2/failure
# Swagger Configuration
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
# Logging Configuration
logging:
  file:
    name: ${LOG_PATH:backend/logs/doc-mind.log}
  level:
    root: INFO
    com.pranit.github: DEBUG
# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include:
          - health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
info:
  app:
    name: repopilot
    description: "RAG"
    version: "1.0.0"
