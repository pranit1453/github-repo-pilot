spring:
  application:
    name: repo-pilot
  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/db
    username: postgres
    password: 140503
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: RepoPilotHikariPool
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  # Flyway Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  # Oauth2 Configuration
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:Ov23liYD3wCIZ0UJHohT}
            client-secret: ${GITHUB_CLIENT_SECRET:811b6e32b3f809b048d20ffda4099165716f684a}
            scope:
              - read:user
              - repo
        provider:
          github:
            user-name-attribute: id
# JWT Token Configuration
security:
  accessToken:
    expiration: 900
  refreshToken:
    expiration: 86400
  token:
    issuer: repo-pilot
  cookie:
    name:
      refreshTokenName: refreshToken
      accessTokenName: accessToken
    cookieHttpOnly: ${COOKIE_HTTP_ONLY:true}
    cookieSecure: ${COOKIE_SECURE:false}
    cookieSameSite: ${COOKIE_SAME_SITE:lax}
    cookieDomain: ${COOKIE_DOMAIN:localhost}
  # Keys Configuration
  keys:
    privateKeyPath: classpath:key/private_key.pem
    publicKeyPath: classpath:key/public_key.pem
  crypto:
    token-encryptor-password: "dummy-password-for-local-development"
    token-encryptor-salt: "deadbeefdeadbeef"
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      - HEAD
    allowed-headers:
      - Content-Type
      - X-Api-Version
      - X-Conversation-ID
    allow-credentials: true
# Oauth2 Success Anf Failure URL
oauth2:
  success: http://localhost:5173/auth/oauth2/success
  failure: http://localhost:5173/auth/oauth2/failure
# Swagger Configuration
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
# Logging Configuration
logging:
  file:
    name: ${LOG_PATH:backend/logs/doc-mind.log}
  level:
    root: INFO
    com.pranit.github: DEBUG
# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include:
          - health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
info:
  app:
    name: repopilot
    description: "RAG"
    version: "1.0.0"